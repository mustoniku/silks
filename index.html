<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi SILIKS Madrasah</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #eefaf3;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      opacity: 0;
      transition: opacity .25s ease;
      background: #fff;
    }
    iframe.ready { opacity: 1; }
    .splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      background: #eaf8f4;
      transition: opacity .25s ease, visibility .25s ease;
    }
    .splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-backdrop,
    .splash-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .splash-backdrop {
      background: url('./welcome-siliks-madrasah.jpg?v=20260828-1') center / cover no-repeat;
      filter: blur(18px) saturate(.88);
      transform: scale(1.05);
      opacity: .55;
    }
    .splash-image {
      z-index: 1;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 18px 48px rgba(15, 82, 57, .16));
    }
    .status {
      position: absolute;
      z-index: 2;
      left: clamp(12px, 2.5vw, 32px);
      top: clamp(12px, 2.5vw, 28px);
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 999px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,.85);
      background: rgba(255,255,255,.82);
      box-shadow: 0 10px 30px rgba(15,82,57,.16);
      backdrop-filter: blur(10px);
      color: #065f46;
      font-size: clamp(11px, 1.35vw, 15px);
      font-weight: 800;
      line-height: 1.2;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid rgba(1,99,53,.18);
      border-top-color: #016335;
      animation: spin .8s linear infinite;
      flex: 0 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 640px) {
      .splash-image { object-position: center 42%; }
      .status {
        left: 10px;
        top: 10px;
        width: max-content;
        max-width: calc(100% - 20px);
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash-backdrop" aria-hidden="true"></div>
    <img
      class="splash-image"
      src="./welcome-siliks-madrasah.jpg?v=20260828-1"
      alt="Selamat datang di Aplikasi SILIKS Madrasah"
      fetchpriority="high"
    >
    <div class="status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Sedang menyiapkan halaman login</span>
    </div>
  </div>

  <iframe
    id="siliksFrame"
    src="https://script.google.com/macros/s/AKfycbzq0X6FiYJT6O8GjXNHFnhVdti9IiklSFqYxFtXy3fkv11zZ2E3Lf7uoB_jm4gj-qyT/exec"
      title="Aplikasi SILIKS Madrasah"
    loading="eager"
  ></iframe>

  <script>
    const frame = document.getElementById('siliksFrame');
    const splash = document.getElementById('splash');
    frame.addEventListener('load', () => {
      frame.classList.add('ready');
      setTimeout(() => splash.classList.add('hidden'), 300);
    });
  </script>
</body>
</html>
