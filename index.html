<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi SILIKS Madrasah</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #eefaf3;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      opacity: 0;
      transition: opacity .25s ease;
      background: #fff;
    }
    iframe.ready { opacity: 1; }
    .splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      background: #eaf8f4;
      transition: opacity .25s ease, visibility .25s ease;
    }
    .splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-backdrop,
    .splash-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .splash-backdrop {
      background: url('./welcome-siliks-madrasah.jpg?v=20260828-1') center / cover no-repeat;
      filter: blur(18px) saturate(.88);
      transform: scale(1.05);
      opacity: .55;
    }
    .splash-image {
      z-index: 1;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 18px 48px rgba(15, 82, 57, .16));
    }
    .status {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 4px;
      transform: translateX(-50%);
      display: flex;
      width: min(300px, calc(100% - 24px));
      flex-direction: column;
      gap: 4px;
      border-radius: 13px;
      padding: 5px 10px 6px;
      border: 1px solid rgba(255,255,255,.85);
      background: rgba(255,255,255,.78);
      box-shadow: 0 10px 28px rgba(15,82,57,.14), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(12px) saturate(1.1);
      color: #065f46;
      font-size: clamp(9px, .9vw, 11px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: .01em;
      text-align: center;
    }
    .progress-track {
      position: relative;
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(6,95,70,.12);
      box-shadow: inset 0 1px 2px rgba(15,23,42,.12);
    }
    .progress-bar {
      position: absolute;
      inset: 0 auto 0 -42%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #10b981, #06b6d4, #3b82f6, #f59e0b, #10b981);
      background-size: 220% 100%;
      box-shadow: 0 0 12px rgba(6,182,212,.5);
      animation: progress-slide 1.55s cubic-bezier(.4,0,.2,1) infinite,
                 progress-colors 2.6s linear infinite;
    }
    @keyframes progress-slide {
      0% { left: -42%; width: 42%; }
      50% { width: 58%; }
      100% { left: 100%; width: 42%; }
    }
    @keyframes progress-colors { to { background-position: -220% 0; } }
    @media (prefers-reduced-motion: reduce) {
      .progress-bar { animation-duration: 3s, 5s; }
    }
    @media (max-width: 640px) {
      .splash-image { object-position: center 42%; }
      .status {
        top: 4px;
        width: min(270px, calc(100% - 18px));
        padding: 5px 9px 6px;
      }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash-backdrop" aria-hidden="true"></div>
    <img
      class="splash-image"
      src="./welcome-siliks-madrasah.jpg?v=20260828-1"
      alt="Selamat datang di Aplikasi SILIKS Madrasah"
      fetchpriority="high"
    >
    <div class="status">
      <span>Sedang menyiapkan halaman login</span>
      <span class="progress-track" aria-hidden="true"><span class="progress-bar"></span></span>
    </div>
  </div>

  <iframe
    id="siliksFrame"
    src="https://script.google.com/macros/s/AKfycbzq0X6FiYJT6O8GjXNHFnhVdti9IiklSFqYxFtXy3fkv11zZ2E3Lf7uoB_jm4gj-qyT/exec"
      title="Aplikasi SILIKS Madrasah"
    loading="eager"
  ></iframe>

  <script>
    const frame = document.getElementById('siliksFrame');
    const splash = document.getElementById('splash');
    frame.addEventListener('load', () => {
      frame.classList.add('ready');
      setTimeout(() => splash.classList.add('hidden'), 300);
    });
  </script>
</body>
</html>
