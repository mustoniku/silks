<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi SILIKS Madrasah</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #eefaf3;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      opacity: 0;
      transition: opacity .25s ease;
      background: #fff;
    }
    iframe.ready { opacity: 1; }
    .splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      background: #eaf8f4;
      transition: opacity .25s ease, visibility .25s ease;
    }
    .splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-backdrop,
    .splash-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .splash-backdrop {
      background:
        radial-gradient(circle at 8% 22%, rgba(153,246,228,.48), transparent 30%),
        radial-gradient(circle at 92% 24%, rgba(186,230,253,.48), transparent 31%),
        radial-gradient(ellipse at 50% 100%, rgba(167,243,208,.42), transparent 50%),
        linear-gradient(135deg, #effdf7 0%, #f8fffc 44%, #eefaff 72%, #fffdf2 100%);
      filter: none;
      transform: none;
      opacity: 1;
    }
    .splash-backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, transparent 0 12%, rgba(255,255,255,.34) 24%, transparent 38%),
        linear-gradient(250deg, transparent 0 12%, rgba(255,255,255,.32) 25%, transparent 39%);
      opacity: .75;
    }
    .splash-image {
      z-index: 1;
      inset: auto;
      left: 50%;
      top: 50%;
      width: min(100vw, 177.7778vh);
      height: min(100vh, 56.25vw);
      transform: translate(-50%, -50%);
      object-fit: fill;
      filter: none;
      -webkit-mask-image: linear-gradient(90deg,
        transparent 0%, rgba(0,0,0,.18) 3%, rgba(0,0,0,.72) 8%, #000 13%,
        #000 87%, rgba(0,0,0,.72) 92%, rgba(0,0,0,.18) 97%, transparent 100%);
      mask-image: linear-gradient(90deg,
        transparent 0%, rgba(0,0,0,.18) 3%, rgba(0,0,0,.72) 8%, #000 13%,
        #000 87%, rgba(0,0,0,.72) 92%, rgba(0,0,0,.18) 97%, transparent 100%);
    }
    .people-labels {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      width: min(100vw, 177.7778vh);
      height: min(100vh, 56.25vw);
      transform: translate(-50%, -50%);
      pointer-events: none;
      font-family: Arial, sans-serif;
    }
    .person-label {
      position: absolute;
      transform: translateX(-50%);
      width: clamp(92px, 13.5%, 226px);
      padding: 5px 7px 6px;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 9px;
      background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(241,253,247,.9));
      box-shadow: 0 2px 9px rgba(5,70,45,.25);
      color: #075b43;
      font-size: clamp(7px, .85vw, 14px);
      font-weight: 800;
      line-height: 1.12;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255,255,255,.75);
    }
    .person-label small {
      display: block;
      margin-top: 2px;
      color: #3d6659;
      font-size: .78em;
      font-weight: 700;
      line-height: 1.12;
    }
    .person-label.top-left { left: 17.2%; top: 72.4%; }
    .person-label.top-right { left: 83.8%; top: 72.4%; }
    .person-label.bottom-1 { left: 25.0%; top: 87.3%; }
    .person-label.bottom-2 { left: 37.0%; top: 87.3%; }
    .person-label.bottom-3 { left: 49.0%; top: 87.3%; }
    .person-label.bottom-4 { left: 61.0%; top: 87.3%; }
    .person-label.bottom-5 { left: 73.0%; top: 87.3%; }
    @media (max-width: 640px) {
      .person-label {
        width: clamp(62px, 15%, 110px);
        padding: 3px 3px 4px;
        border-radius: 6px;
        font-size: clamp(5px, 1.35vw, 9px);
      }
      .person-label small { font-size: .72em; }
    }
    .status {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 18.5%;
      transform: translateX(-50%);
      display: flex;
      width: min(420px, calc(100% - 28px));
      flex-direction: column;
      gap: 7px;
      border-radius: 0;
      padding: 4px 10px;
      border: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      color: #065f46;
      font-size: clamp(12px, 1.2vw, 15px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: .01em;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255,255,255,.95), 0 2px 10px rgba(255,255,255,.9);
    }
    .progress-track {
      position: relative;
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: linear-gradient(90deg,
        rgba(22,163,74,.18), rgba(20,184,166,.18), rgba(6,182,212,.18),
        rgba(59,130,246,.18), rgba(139,92,246,.18), rgba(245,158,11,.18));
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: 0 2px 10px rgba(15,82,57,.18), inset 0 1px 2px rgba(15,23,42,.12);
      backdrop-filter: blur(5px);
    }
    .progress-bar {
      position: absolute;
      inset: 0 auto 0 -42%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #16a34a, #14b8a6, #06b6d4, #3b82f6, #8b5cf6, #f59e0b, #16a34a);
      background-size: 220% 100%;
      box-shadow: 0 0 14px rgba(6,182,212,.65), 0 0 6px rgba(245,158,11,.35);
      animation: progress-slide 1.55s cubic-bezier(.4,0,.2,1) infinite,
                 progress-colors 2.6s linear infinite;
    }
    @keyframes progress-slide {
      0% { left: -42%; width: 42%; }
      50% { width: 58%; }
      100% { left: 100%; width: 42%; }
    }
    @keyframes progress-colors { to { background-position: -220% 0; } }
    @media (prefers-reduced-motion: reduce) {
      .progress-bar { animation-duration: 3s, 5s; }
    }
    @media (max-width: 640px) {
      .status {
        top: 17.5%;
        width: min(350px, calc(100% - 20px));
        padding: 3px 8px;
      }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash-backdrop" aria-hidden="true"></div>
    <img
      class="splash-image"
      src="./welcome-siliks-madrasah.jpg?v=20260828-1"
      alt="Selamat datang di Aplikasi SILIKS Madrasah"
      fetchpriority="high"
    >
    <div class="people-labels" aria-label="Pimpinan dan tim SILIKS">
      <div class="person-label top-left">H. AHMAD MUHDZIR, S.Ag., M.M.<small>Kepala Kantor Kementerian Agama Kabupaten Tegal</small></div>
      <div class="person-label top-right">H. BY RONI SULCHAN, S.Ag., M.Pd.I.<small>Kepala Seksi Pendidikan Madrasah</small></div>
      <div class="person-label bottom-1">Adelina</div>
      <div class="person-label bottom-2">Ita Fariyati</div>
      <div class="person-label bottom-3">Mustoni</div>
      <div class="person-label bottom-4">Arief</div>
      <div class="person-label bottom-5">Ali Maftukhin</div>
    </div>
    <div class="status">
      <span>Sedang menyiapkan halaman login</span>
      <span class="progress-track" aria-hidden="true"><span class="progress-bar"></span></span>
    </div>
  </div>

  <iframe
    id="siliksFrame"
    src="https://script.google.com/macros/s/AKfycbzq0X6FiYJT6O8GjXNHFnhVdti9IiklSFqYxFtXy3fkv11zZ2E3Lf7uoB_jm4gj-qyT/exec"
      title="Aplikasi SILIKS Madrasah"
    loading="eager"
  ></iframe>

  <script>
    const frame = document.getElementById('siliksFrame');
    const splash = document.getElementById('splash');

    let appIsReady = false;
    const revealApplication = () => {
      if (appIsReady) return;
      appIsReady = true;
      frame.classList.add('ready');
      setTimeout(() => splash.classList.add('hidden'), 300);
    };

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'SILIKS_APP_READY') {
        revealApplication();
      }
    });

    // Pengaman apabila browser memblokir pesan dari iframe.
    frame.addEventListener('load', () => {
      setTimeout(revealApplication, 15000);
    });
  </script>
</body>
</html>
